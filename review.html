<title>輸血分野① 復習ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one question at a time in a single reading column; progress map of all 36 above it. Palette from Color Hunt #FCF5EE #FDE4E6 #FFC4C4 #EE6983. */
:root{
  --paper:#FCF5EE; --blush:#FDE4E6; --rose:#FFC4C4; --coral:#EE6983;
  --card:#FFFBF9; --ink:#3A1621; --muted:#7E4F5C; --accent:#850E35;
  --ok:#2F8465; --ok-bg:#DDF1E7; --ng:#850E35; --ng-bg:#FDE4E6;
  --line:#F2CDD3;
  --f-disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1F1418; --blush:#3A2229; --rose:#5E2F3C; --coral:#EE6983;
  --card:#2A1B21; --ink:#F7E6EA; --muted:#C9A7B1; --accent:#F58FA6;
  --ok:#7ED3AE; --ok-bg:#1F3A2F; --ng:#F58FA6; --ng-bg:#52253A; --line:#4D2C37; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1F1418; --blush:#3A2229; --rose:#5E2F3C; --coral:#EE6983;
  --card:#2A1B21; --ink:#F7E6EA; --muted:#C9A7B1; --accent:#F58FA6;
  --ok:#7ED3AE; --ok-bg:#1F3A2F; --ng:#F58FA6; --ng-bg:#52253A; --line:#4D2C37; color-scheme:dark}
*{box-sizing:border-box}
.banner{display:block;width:100%;height:auto;aspect-ratio:1200/190;object-fit:cover;border-radius:14px;margin:16px 0 14px}

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
header{padding-block:28px 12px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(26px,6vw,36px);line-height:1.3;margin:4px 0 0;text-wrap:balance}
h1 .mark{background:linear-gradient(transparent 62%,var(--rose) 62%)}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-size:20px;color:var(--ink);font-weight:500;margin-right:2px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--blush);border-radius:3px;margin-top:10px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-ng{background:var(--coral)}

.controls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:16px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:4px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#3A0717;font-weight:700}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible,.cell:focus-visible,.blank:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:inherit;font-size:13px;padding:4px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
label.sw{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer}

.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin:8px 0 22px}
.cell{font-family:var(--f-mono);font-size:12px;height:30px;border-radius:7px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.cell.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cell.ng{background:var(--ng-bg);border-color:var(--coral);color:var(--ng)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.dim{opacity:.28}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px 22px 18px}
@media (max-width:480px){.card{padding:18px 16px 14px;border-radius:14px}}
.qhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.qno{font-family:var(--f-disp);font-weight:700;font-size:22px;color:var(--accent)}
.tag{font-size:12px;background:var(--blush);color:var(--muted);padding:1px 10px;border-radius:999px}
.tag.two{background:var(--coral);color:#3A0717;font-weight:700}
.stem{font-size:17px;font-weight:500;margin:4px 0 14px}
.fig{margin:0 0 16px;border-radius:12px;overflow:hidden;border:1.5px solid var(--line);max-width:420px}
.fig img{display:block;width:100%}
.opts{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.opt{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;cursor:pointer;transition:background .15s,border-color .15s}
.opt:hover:not(:disabled){background:var(--blush);border-color:var(--rose)}
.opt .num{font-family:var(--f-mono);font-size:14px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--blush);color:var(--muted);margin-top:1px}
.opt.sel{border-color:var(--coral);background:var(--blush)}
.opt.sel .num{background:var(--coral);color:#3A0717}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .num{background:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--coral);background:var(--ng-bg)}
.opt .mk{font-weight:700;font-size:13px;white-space:nowrap;align-self:center}
.opt.right .mk{color:var(--ok)} .opt.wrong .mk{color:var(--ng)}
.opt .note{grid-column:2 / 4;font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:-2px}

.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:16px}
.btn{font:inherit;font-size:14px;font-weight:700;border-radius:10px;padding:8px 16px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#3A0717}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);font-weight:500}

.verdict{margin-top:18px;padding:10px 14px;border-radius:12px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.ng{background:var(--ng-bg);color:var(--ng)}
.verdict span{font-weight:500;color:var(--ink)}

.points{margin-top:20px;border-top:1.5px dashed var(--line);padding-top:16px}
.points h2{font-family:var(--f-disp);font-size:17px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.points .hint{font-size:12px;color:var(--muted);margin:0 0 8px}
.points ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.points li{padding-left:1.3em;position:relative;font-size:15px}
.points li::before{content:"☆";position:absolute;left:0;color:var(--coral)}
.blank{font:inherit;display:inline;border:0;border-bottom:2px solid var(--coral);background:var(--blush);color:transparent;border-radius:4px 4px 0 0;padding:0 4px;cursor:pointer;min-width:3em;line-height:1.5;user-select:none}
.blank.open{color:var(--accent);font-weight:700;background:transparent;cursor:text;user-select:text}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer{margin-top:28px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.confirm{display:inline-flex;gap:6px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const Q = [{"n":1,"c":"abo","q":"ABO血液型のオモテ・ウラ検査不一致で、ウラ検査側に原因があるのはどれか。","o":["亜型","キメラ","連銭形成","汎血球凝集","acquired B"],"a":[3],"e":["赤血球の A・B 抗原が弱い → オモテ検査側の原因。","2種類の赤血球が混在（部分凝集）→ オモテ検査側。","正しい。血清蛋白の異常で試薬赤血球が凝集して見える。","露出した T 抗原などが血漿中の自然抗体と反応する。患者の赤血球側の異常。","A 型の赤血球に B 様抗原が出る → オモテ検査側。"],"p":["亜型血液型：赤血球の A・B 抗原の[[抗原量]]が遺伝的に[[少ない]]血液型。日本人では A 亜型より[[B 亜型]]（特に[[Bm]]型）が多く、頻度は約[[0.2]]%。","キメラ：同一人の血液中に血液型の[[異なる]]2種類の[[赤血球]]が混在する（2卵性双生児のほか、[[造血幹細胞移植]]後や輸血後にもみられる）。","モザイク：単一の受精卵から[[突然変異]]などで生じた、[[遺伝子]]的に異なる細胞集団が混在する。","連銭形成：高γグロブリン血症など[[血清タンパク]]の異常で、赤血球が連なって凝集のように見える。","汎血球凝集：[[細菌・ウイルス感染症]]などで赤血球膜の糖蛋白が除かれ、T・Tn・Tk などの[[赤血球内在性抗原]]が露出して自然抗体と反応する。","acquired B：A 型患者が疾患などで後天的に[[AB 型]]様の反応を示す。赤血球に[[B 抗原]]が一過性に出現する。","※資料の「連鎖形成」は「連銭形成」に直しています。"]},{"n":2,"c":"abo","q":"ABO血液型検査の結果（表）と判定の組み合わせとして正しいのはどれか。2つ選べ。","o":["①　ボンベイ型","②　A亜型","③　B型","④　cisAB型","⑤　B亜型"],"a":[3,5],"e":["ボンベイ型は抗A・抗B・抗H をもつので、ウラ検査の A・B・O 血球すべてが凝集する。","O 血球にも凝集 → 寒冷凝集素や不規則抗体を疑う。","正しい。","ウラ検査で A・B・O 血球すべてに弱い凝集 → 寒冷凝集素や不規則抗体を疑う。","正しい。B 抗原が弱くオモテで検出されないが、抗B はもたない。"],"p":["ボンベイ型：H 抗原の転移酵素が不活性で[[H 抗原]]が存在せず、血液中に[[抗A・抗B・抗H]]抗体をもつ。","cisAB 型：A・B 遺伝子が[[同一染色体]]上にあり、A・B 抗原の発現が通常の AB 型より[[弱い]]。","ウラ検査ですべて（＋）：[[寒冷凝集素]]や[[不規則性抗体]]を疑う。","B 亜型：B 抗原の発現が遺伝的に[[弱い]]血液型。"],"img":"q02"},{"n":3,"c":"clinical","q":"輸血用血液製剤の写真を示す。外観変化の原因として考えられるのはどれか。","o":["細菌汚染","放射線照射","溶血","スワーリング","凝固物の析出"],"a":[1],"e":["正しい。赤血球製剤が黒っぽく変色している（エルシニア菌など）。","放射線照射で外観は変わらない。","溶血ではバッグ内が赤く透けて見える。黒色化はしない。","血小板製剤の品質がよいときにみられる渦巻き状のパターン。","凝固物は血漿・血小板製剤でみられる白っぽい塊。"],"p":["赤血球製剤の[[変色]]（黒っぽくなる）は[[細菌汚染]]を疑い、使用しない。","血小板製剤：[[スワーリング]]がみられるのは品質が保たれている証拠。[[色調]]の変化や[[凝固物]]があれば使用しない。","新鮮凍結血漿：融解温度が低いと[[クリオプレシピテート]]が析出する（30〜37℃で融解）。"],"img":"q03"},{"n":4,"c":"abo","q":"ABO血液型について正しいのはどれか。","o":["分泌型では唾液中に血液型物質を認める。","AB型は自然抗体として抗Aと抗Bを保有する。","新生児の血液型判定はウラ検査を実施する。","O型の赤血球表面にはH抗原が存在しない。","緊急輸血の場合はAB型の赤血球を輸血する。"],"a":[1],"e":["正しい。","AB 型は抗A・抗B のどちらももたない。","生後4か月以内はオモテ検査のみで判定する。","O 型は H 抗原が最も多い。","血液型がわからない緊急時は O 型の赤血球を輸血する。"],"p":["ABH 血液型物質を体液中（唾液・胃液など）に多く分泌する[[分泌型（Se）]]と、少量しか分泌しない[[非分泌型（se）]]がある。","出生時の抗A・抗B は[[母親由来の IgG 抗体]]のみ。自分の抗体は生後3〜5か月から作られる。","生後[[4]]か月以内の乳児は抗体の[[産生が不十分]]なので、ABO 血液型は[[オモテ]]検査のみで判定する。","緊急時：ABO 型検査ができないときは[[O 型]]赤血球液、検査ができれば[[同型]]の赤血球液を輸血する。"]},{"n":5,"c":"test","q":"交差適合試験について正しいのはどれか。","o":["抗Eを保有する患者にはE抗原陽性の赤血球を選択する。","輸血歴がなければ省略できる。","輸血予定前3日以内に採血した検体を使用する。","主試験は受血者赤血球と供血者血漿を使用する。","間接抗グロブリン試験は省略できる。"],"a":[3],"e":["E 抗原陰性の赤血球を選ぶ。","輸血歴がなくても妊娠などで抗体をもつことがあり、省略できない。","正しい。","主試験は受血者の血漿（血清）と供血者の赤血球。記述は副試験。","臨床的意義のある不規則抗体を検出するため、間接抗グロブリン試験を含める。"],"p":["交差適合試験の検体は、ABO 血液型検査とは[[別の時点]]で採血した、輸血予定日に先立つ[[3日以内]]のものを用いる。","主試験：受血者の[[血漿（血清）]]と供血者の[[赤血球]]","副試験：受血者の[[赤血球]]と供血者の[[血漿（血清）]]","ABO 不適合と、37℃で反応する臨床的意義のある不規則抗体を検出できる[[間接抗グロブリン試験]]を含む方法で行う。"]},{"n":6,"c":"test","q":"間接抗グロブリン試験について正しいのはどれか。","o":["洗浄不足により偽陽性となる","冷式抗体の検出に適している","Duffy系の抗体は検出できない","多特異性抗グロブリン血清を用いる","被検者赤血球に感作しているIgGクラスの抗体を検出する"],"a":[4],"e":["残ったIgG 蛋白が抗グロブリン試薬を中和して偽陰性になる。","37℃で反応する温式抗体の検出に適している。冷式抗体は生理食塩液法。","Duffy 系は間接抗グロブリン試験で検出する（酵素法では検出できない）。","正しい。","これは直接抗グロブリン試験。間接は血清中の抗体を検出する。"],"p":["赤血球の洗浄が不十分で[[IgG 蛋白が残存]]すると抗グロブリン試薬が中和され、[[偽陰性]]になる。","低温反応性の抗体を検出できるのは[[生理食塩液法]]。間接抗グロブリン試験は[[37℃]]で反応する抗体の検出に適する。","Kell・[[Duffy]]・Kidd・Ss・Diego 系の抗体は主に[[間接抗グロブリン試験]]で検出する（Duffy・S/s 抗原は酵素処理で壊れるので酵素法では検出できない）。","間接抗グロブリン試験は[[血清中]]の IgG 抗体、[[直接抗グロブリン]]試験は赤血球に感作した IgG 抗体を検出する。","※試験管法の不規則抗体検査・交差適合試験では多特異性試薬が基本（PEG-IAT では抗IgG 試薬）。"]},{"n":7,"c":"adverse","q":"輸血後GVHDについて正しいのはどれか。","o":["輸血後数時間で発症する","血縁者間の輸血での発症は少ない","新鮮な血液の輸血により予防できる","輸血用液の紫外線照射により予防できる","輸血用血液製剤中の供血者のリンパ球が生着するために起こる"],"a":[5],"e":["輸血後1〜2週間で発症する。","HLA 一方向適合がおこりやすい血縁者間で多い。","新鮮な血液ほどリンパ球が活発で危険性が高い。","予防は放射線照射。","正しい。"],"p":["輸血後 GVHD：製剤中の[[供血者リンパ球]]が排除されずに[[受血者]]に生着し、患者の組織を障害する。","輸血後[[1〜2週間]]で発熱・紅斑、肝障害、下痢、汎血球減少をおこし、ほとんどが1か月以内に死亡する。","HLA 一方向適合は非血縁者より[[血縁者間]]でおこりやすく、危険性が[[高い]]。","予防は製剤への[[放射線照射]]（[[15〜50]] Gy）でリンパ球の増殖を抑える。","新鮮な血液ほど[[リンパ球]]が活発で危険性が高い。"]},{"n":8,"c":"clinical","q":"自己血輸血について正しいのはどれか。","o":["まれな血液型の患者では適応とならない","不規則性抗体産生の可能性が高い","回収式自己血輸血は術前に採血を行う","未使用であれば他の患者に使用することができる","輸血後移植片対宿主病の可能性がない"],"a":[5],"e":["まれな血液型の患者こそよい適応になる。","自分の血液なので同種抗体はできない。","回収式は手術中に出血した血液を回収する。術前に採血するのは貯血式。","他の患者には使えない。","正しい。"],"p":["貯血式：手術前に患者自身の血液を採血して保存する。1回の採血量は[[400]] mL まで、条件を満たせば週[[1]]回採血できる。","希釈式：手術直前（麻酔導入後）に採血して代替輸液を行い、患者の血液を[[希釈]]した状態で手術する。","回収式：[[手術中]]に出血した血液を回収し、遠心分離した[[赤血球成分]]を患者に返す。"]},{"n":9,"c":"abo","q":"両親の血液型は通常のA型RhD陽性とAB型RhD陽性であった。この両親から生まれない血液型はどれか。","o":["A型RhD陽性","B型RhD陽性","A型RhD陰性","AB型RhD陰性","O型RhD陽性"],"a":[5],"e":["生まれうる（AA・AO）。","生まれうる（BO）。","両親が Dd なら dd が生まれうる。","生まれうる（AB・dd）。","正しい。AB 型の親から O 遺伝子は受け継がれない。"],"p":["A 型（AA/AO）と AB 型（AB）からは、A 型（[[AA/AO]]）、B 型（[[BO]]）、AB 型（[[AB]]）が生まれうる。","RhD 陽性（[[DD/Dd]]）同士からは、RhD 陽性も RhD 陰性（[[dd]]）も生まれうる。"]},{"n":10,"c":"test","q":"交差適合試験について正しいのはどれか。2つ選べ。","o":["被検血清は不活化して用いる","血清2滴と3〜5％浮遊液1滴の比率が良い","生理食塩液法では37℃で反応するIgG抗体を最も多く検出できる","主試験が凝集した場合は供血者の不規則性抗体を疑う","間接抗グロブリン試験で自己対照が凝集した場合は直接抗グロブリン試験を行う"],"a":[2,5],"e":["不活化すると補体が失われ、抗体を検出しにくくなる。","正しい。","37℃で反応する IgG 抗体を最も多く検出できるのは間接抗グロブリン法。","主試験の凝集は受血者の抗体（不規則抗体など）を疑う。","正しい。"],"p":["生理食塩液法：[[ABO 不適合輸血]]を防げる。","ブロメリン法：低力価の[[Rh 血液型]]抗体を高感度に検出できる。","間接抗グロブリン法：[[37℃]]で反応する[[臨床的意義]]のある不規則抗体を最も多く検出できる。","間接抗グロブリン試験で自己対照が凝集したら[[自己抗体]]を疑い、[[直接抗グロブリン]]試験を行う。","試験管法の比率は血清[[2]]滴＋3〜5%赤血球浮遊液[[1]]滴。","※国試原文の選択肢2は「血清1滴と3〜5％浮遊液2滴」の誤記と考え、修正しています。","※国試原文の選択肢3は「生理食塩水法の凝集は臨床的に重要である」（ABO 不適合の検出と紛らわしいため差し替え）。"]},{"n":11,"c":"adverse","q":"輸血副作用とその原因の組み合わせで正しいのはどれか。","o":["輸血後紫斑病 ― 抗血漿蛋白抗体","輸血後GVHD ― 抗HLA抗体","溶血性輸血副作用 ― 抗血小板抗体","輸血関連急性肺障害 ― 抗顆粒球抗体","アナフィラキシー反応 ― Rh不適合輸血"],"a":[4],"e":["輸血後紫斑病は受血者の抗血小板抗体（抗HPA）。","輸血後 GVHD は供血者リンパ球の生着。","溶血性副作用は赤血球に対する抗体（ABO 不適合など）。","正しい。抗HNA（顆粒球）・抗HLA 抗体が原因。","アナフィラキシーは抗IgA などの抗血漿蛋白抗体。"],"p":["輸血後紫斑病：受血者の[[血小板抗体]]（抗HPA 抗体）により、輸血後5〜12日に[[血小板減少症]]をおこす。","輸血後 GVHD：製剤中の[[供血者リンパ球]]が受血者に生着する。","溶血性副作用：急性は大部分が[[ABO 不適合輸血]]、遅発性は[[ABO 以外の不適合輸血]]による。","TRALI：製剤中の[[抗白血球抗体]]（[[抗HLA]]・[[抗HNA]] 抗体など）が好中球を活性化し、肺の毛細血管を傷つける。","アナフィラキシー：[[抗血漿蛋白]]抗体（[[抗IgA]] 抗体、抗ハプトグロビン抗体など）が原因。"]},{"n":12,"c":"clinical","q":"移植について正しいのはどれか。","o":["家族からの移植を自家移植という","末梢血由来の造血幹細胞は移植できない","超急性拒絶反応は抗HLA抗体が関与する","骨髄移植は採取した骨髄液を腸骨に投与する","造血幹細胞移植はABO血液型の一致が必須である"],"a":[3],"e":["家族（他者）からの移植は同種移植。","末梢血幹細胞移植がある。","正しい。","骨髄液は静脈内に投与する。","ABO 血液型が異なっていても移植できる。"],"p":["自家移植は[[患者自身]]、同種移植は[[他者]]の造血幹細胞を移植する。","造血幹細胞移植は由来により[[骨髄移植]]・[[末梢血幹細胞移植]]・[[臍帯血移植]]に分けられる。","超急性拒絶反応：レシピエントがドナーの HLA に対する[[抗HLA 抗体]]をもっているとおこる。","骨髄移植：HLA の適合する骨髄液を[[静脈内]]に投与する。[[ABO 血液型]]が異なっていても移植できる。","※資料の選択肢5「造血幹細胞輸血」は「造血幹細胞移植」に直しています。"]},{"n":13,"c":"adverse","q":"献血血液に対して核酸増幅検査が行われるのはどれか。2つ選べ。","o":["HIV","HBV","HTLV-1","ヒトパルボウイルスB19","インフルエンザウイルス"],"a":[1,2],"e":["正しい。","正しい。","HTLV-1 は抗体検査。","パルボウイルス B19 は抗原検査。","献血の検査項目にない。"],"p":["核酸増幅検査（NAT）：[[HBV]]-DNA、[[HCV]]-RNA、[[HIV]]-1,2-RNA、[[HEV]]-RNA","抗原抗体検査：梅毒（[[TP 抗体]]）、HBV（HBs 抗原・HBs 抗体・HBc 抗体）、HCV 抗体、HIV-1,2 抗体、[[HTLV-1]] 抗体、パルボウイルス B19 [[抗原]]"]},{"n":14,"c":"abo","q":"カラム凝集法の血液型検査の結果を示す。判定として正しいのはどれか。","o":["O型, RhD陰性","AB型, RhD陰性","AB型, RhD判定保留","A型, RhD陰性","B型, RhD判定保留"],"a":[3],"e":["抗A・抗B とも凝集しているので O 型ではない。","抗D（−）だけでは RhD 陰性と確定できない。D 陰性確認試験が必要。","正しい。","抗B も凝集している。","抗A も凝集している。"],"p":["抗D（＋）・Rh コントロール（−）→ [[RhD 陽性]]と確定。","抗D（＋）・Rh コントロール（＋）→ [[判定保留]]","抗D（−）・Rh コントロール（−）→ [[D 陰性確認試験]]を行う。それまでは[[判定保留]]とし、確認試験も陰性なら RhD 陰性。","weak D：抗D の直後判定で[[陰性（弱陽性）]]、D 陰性確認試験で[[陽性]]。受血者なら[[D 陰性]]血液、供血者なら[[D 陽性]]血液として扱う。"],"img":"q14"},{"n":15,"c":"test","q":"直接抗グロブリン試験が有用なのはどれか。","o":["交差適合試験","不規則性抗体検査","新生児溶血性疾患の検査","Rh0(D)陰性の追加検査","Rh不適合妊娠の母親の検査"],"a":[3],"e":["間接抗グロブリン試験を用いる。","間接抗グロブリン試験を用いる。","正しい。児の赤血球に結合した母親由来の IgG を検出する。","D 陰性確認試験は間接抗グロブリン試験。","母親は血清中の抗体を間接抗グロブリン試験で調べる。"],"p":["直接抗グロブリン試験：[[赤血球]]が体内ですでに抗体や補体で[[感作されている]]かを調べる。[[自己免疫性溶血性貧血]]や[[新生児溶血性疾患]]の検査に有用。","交差適合試験・不規則性抗体検査・D 陰性確認試験には[[間接抗グロブリン試験]]を用いる。","母児不適合：母親は[[間接]]抗グロブリン試験で IgG 抗体と力価、児は[[直接]]抗グロブリン試験で母由来の IgG 感作赤血球を調べる。","Rh（D）不適合妊娠：D 陰性の母親が D 陽性の児を妊娠すると[[抗D 抗体]]が作られ、[[2回目以降]]の妊娠で胎児の赤血球が破壊される。","予防：D 陰性の母親に、分娩後[[72]]時間以内（と妊娠28週前後）に[[抗D 免疫グロブリン]]を投与する。","ABO 不適合妊娠：主に母親が[[O 型]]、児が A 型・B 型のとき。[[初めての妊娠]]でもおこりうるが、重症例はまれ（出生後の黄疸が強くなる）。"]},{"n":16,"c":"test","q":"輸血予定患者の血液型検査および不規則性抗体検査を実施した結果、A型、RhD陽性、抗E抗体陽性であり、抗原検査ではE(-),c(-)が確認された。この患者に輸血する血液として最も適した血液型はどれか。","o":["CCDEe","CCDee","CcDEe","CcDee","ccDee"],"a":[2],"e":["E 抗原陽性なので抗E と反応する。","正しい。患者と同じ CCDee で、E も c ももたない。","E 抗原陽性。c 抗原も陽性。","c 抗原陽性で、抗c を作る可能性がある。","c 抗原陽性で、抗c を作る可能性がある。"],"p":["Rh 血液型には C・c・D・E・e 抗原がある。[[D 抗原]]は免疫原性が最も強い。","[[E 抗原]]は D 抗原に次いで免疫原性が強く、日本人では[[抗E 抗体]]がよく検出される。","E(−)・c(−) なので、患者の Rh 血液型は[[CCDee]]と考えられる。抗E があるので E 抗原[[陰性]]の血液を選び、新たな抗c も作らせないよう[[c 抗原]]陰性の血液を選ぶ。","※資料では選択肢1に丸が付いていますが、正答は2（CCDee）にしています。"]},{"n":17,"c":"abo","q":"ABO血液型について正しいのはどれか。2つ選べ。","o":["分泌型はLewis血液型と関係している。","遺伝子は第6染色体の長腕上に存在する。","O型赤血球のH抗原量はA1型赤血球より多い。","新生児の血液型の検査はウラ検査で判断する。","父親がO型、母親がcisAB型のときO型の子供は生まれない。"],"a":[1,3],"e":["正しい。","第9染色体の長腕。","正しい。O 型は H 抗原が A・B 抗原に変換されないので最も多い。","生後4か月以内はオモテ検査のみで判定する。","母親が AB/O なら O 型の子が生まれうる。"],"p":["分泌型・非分泌型は[[Lewis]]血液型と相関する。非分泌型は Se 酵素を欠くホモ接合体（se/se）。","ABO 血液型を決める遺伝子は第[[9]]染色体長腕上にある。","H 抗原の量：[[O]] > A2 > B > A2B > A1 > A1B","抗A・抗B は生後[[3〜5]]か月から作られ始め、5〜10歳頃にピークとなる。","cisAB 型は AB/A、AB/B、[[AB/O]] の遺伝子型をとるので、父が O/O、母が AB/O なら[[O 型]]の子が生まれうる。","※国試原文の選択肢3は「A1型とA2型のA抗原は同じ構造である」（A2 は量だけでなく質的にも違うとされ紛らわしいため差し替え）。"]},{"n":18,"c":"adverse","q":"輸血副作用について正しいのはどれか。2つ選べ。","o":["輸血後肝炎のリスクは核酸増幅検査で低減できる","輸血後GVHDは不規則性抗体が原因である","血管内溶血は製剤中の補体が原因である","非溶血性発熱反応は紫外線照射で予防できる","輸血関連急性肺障害は抗白血球抗体が原因である"],"a":[1,5],"e":["正しい。ウインドウ期を短くして感染のリスクを減らす（ウインドウ期があるのでゼロにはできない）。","供血者 T 細胞の生着が原因。","受血者の抗体（抗A・抗B など）が受血者の補体を活性化しておこる。","予防は保存前白血球除去。","正しい。"],"p":["輸血後 GVHD は[[ドナー T 細胞の生着]]が原因 → 予防は[[放射線照射]]","血管内溶血は[[受血者の抗体]]（抗A・抗B など）が[[補体]]を活性化しておこる。","非溶血性発熱反応は[[ドナーの白血球]]に対する患者の抗体や、保存中に白血球から出た[[サイトカイン]]が原因 → 予防は保存前[[白血球除去]]","核酸増幅検査（NAT）は[[ウインドウ期]]を短くして感染リスクを[[低減]]するが、ゼロにはできない。","※資料の「非溶血性発熱作用」は「非溶血性発熱反応」に直しています。","※国試原文の選択肢1は「輸血後肝炎は核酸増幅検査で予防できる」（厳密には完全には予防できないため表現を変更）。"]},{"n":19,"c":"clinical","q":"血液型不適合妊娠について正しいのはどれか。2つ選べ。","o":["母親のIgGに属する抗体が原因となる","児の赤血球破壊は血管内溶血による","ABO不適合はRh不適合に比べ重篤である","日本人はRhE不適合妊娠が高頻度で起こる","RhD不適合では新生児の直接抗グロブリン試験が陰性となる"],"a":[1,4],"e":["正しい。IgG は胎盤を通過する。","マクロファージによる血管外溶血。","Rh 不適合のほうが重篤になりやすい。","正しい。","児の赤血球に母親由来の抗D が結合しているので、直接抗グロブリン試験は陽性。"],"p":["母親の[[赤血球抗体]]が [[IgG]] 抗体のため胎盤を通過し、児の[[赤血球]]に結合する。","抗体が結合した赤血球は胎児の[[マクロファージ]]に捕らえられて破壊される（[[血管外溶血]]）。","日本人では[[抗E 抗体]]が高頻度に検出される。","新生児では[[直接]]抗グロブリン試験で、赤血球に結合した母親由来の IgG を調べる。","※国試原文の選択肢5は「新生児の間接グロブリン試験が陽性となる」（新生児の血清にも母親由来の抗体が残り陽性になりうるため差し替え）。"]},{"n":20,"c":"abo","q":"ABO血液型検査の結果を表に示す。考えられるのはどれか。2つ選べ。","o":["B亜型","白血病","新生児","不規則性抗体","無γ-グロブリン血症"],"a":[1,2],"e":["正しい。B 抗原が弱くオモテ検査で陰性になる。","正しい。白血病では血液型抗原の発現が弱くなることがある。","新生児はウラ検査の不一致の原因。","ウラ検査の不一致の原因。","ウラ検査の不一致の原因（抗体ができない）。"],"p":["B 亜型では B 抗原の発現が[[弱い]]ため、[[オモテ検査]]で陰性になることがある。","[[白血病]]患者では血液型抗原の発現が[[弱く]]なることがある。","新生児、不規則性抗体、無γ-グロブリン血症は[[ウラ検査]]の不一致の原因となる。"],"img":"q20"},{"n":21,"c":"adverse","q":"血小板輸血不応に関与する抗体はどれか。2つ選べ。","o":["抗P抗体","抗HPA抗体","抗Lewis抗体","抗HLA-classⅠ抗体","抗HLA-classⅡ抗体"],"a":[2,4],"e":["赤血球の P 血液型に対する抗体。","正しい。血小板特異抗原に対する抗体。","赤血球の Lewis 血液型に対する抗体。","正しい。","HLA classⅡ は血小板に発現しない。"],"p":["血小板輸血不応（PTR）：血小板輸血後に患者の血小板数が[[増加しない]]状態。","主な原因は[[抗HLA-classⅠ]]抗体と[[抗HPA]]（血小板特異抗原）抗体。","血小板には HLA-classⅠ 抗原は発現するが、[[HLA-classⅡ]] 抗原は発現しない。","※資料の「抗PHA抗体」「抗Lewise抗体」は「抗HPA抗体」「抗Lewis抗体」に直しています。"]},{"n":22,"c":"test","q":"タイプアンドスクリーンで正しいのはどれか。","o":["輸血検査の標準化を目的として行われる","術前に受血者の血液型検査だけを済ませておく","術前に手術時の輸血量が多いと予想される場合に実施される","RhD陽性で不規則抗体陰性の場合には交差適合試験を省略できる","患者に使用予定の血液製剤との交差適合試験を術前に済ませておく"],"a":[4],"e":["血液の有効利用（準備血の削減）が目的。","不規則抗体スクリーニングも行う。","輸血の可能性が低い手術が対象。多量輸血が見込まれれば交差適合試験を済ませておく。","正しい。","交差適合試験は術前に行わない。"],"p":["T&S は術前に[[ABO/RhD 型判定]]（Type）と[[不規則抗体スクリーニング]]（Screen）だけを行い、交差適合試験は行わずに待機する。","最近3か月以内に妊娠・輸血歴があれば、[[72時間以内]]の検体を用いるのが原則。","スクリーン陰性で臨床的意義のある抗体の既往もなければ、交差適合試験を術前に[[行わない]]。","スクリーン陽性なら、抗体同定 → [[抗原陰性製剤]]の選定 → [[交差適合試験]]","T&S は[[多量輸血]]が想定されない手術に適する。多量輸血が見込まれるときや[[抗体保有]]例は Type & Crossmatch。"]},{"n":23,"c":"test","q":"検体で患者血清を用いるのはどれか。2つ選べ。","o":["ウラ検査","RhD検査","オモテ検査","直接抗グロブリン試験","間接抗グロブリン試験"],"a":[1,5],"e":["正しい。","患者赤血球に抗D 試薬を反応させる。","患者赤血球に抗A・抗B 試薬を反応させる。","患者赤血球を用いる。","正しい。"],"p":["オモテ検査：患者[[赤血球]]＋[[抗A・抗B 試薬]]で ABO 抗原を判定する。","ウラ検査：患者[[血清]]＋既知の[[A1 血球・B 血球]]で抗A・抗B の有無をみる。","RhD 検査：患者[[赤血球]]に[[抗D 試薬]]を反応させる。","直接抗グロブリン試験：患者[[赤血球]]に結合している [[IgG 抗体]]を検出する。","間接抗グロブリン試験：患者[[血清]]＋[[スクリーニング血球]] → 37℃ → 洗浄 → [[抗ヒトグロブリン試薬]]で温式 IgG 抗体を検出する。"]},{"n":24,"c":"adverse","q":"非溶血性輸血副作用で免疫性の遅発型副作用はどれか。","o":["クエン酸中毒","アレルギー反応","輸血後鉄過剰症","輸血関連急性肺障害","輸血後移植片対宿主病"],"a":[5],"e":["非免疫性・急性。","免疫性・急性。","非免疫性・遅発性。","免疫性・急性。","正しい。免疫性・遅発性。"],"p":["クエン酸中毒〔非免疫・急性〕：クエン酸が [[Ca²⁺]]・Mg²⁺ をキレートし低Ca 血症。代謝後は[[代謝性アルカローシス]]","アレルギー反応〔免疫・急性〕：受血者の [[IgE]] がドナーの血漿蛋白に反応。重症例は IgA 欠損者の[[抗IgA]]や抗ハプトグロビンによる。輸血直後〜数十分の[[即時型]]。","輸血後鉄過剰症〔非免疫・遅発〕：長期の反復輸血で[[鉄が蓄積]]し、肝・心・内分泌臓器に沈着する（全血400 mL 由来の赤血球に鉄約200 mg）。","TRALI〔免疫・急性〕：ドナーの[[抗HLA・抗HNA]]が受血者の好中球を活性化し、肺の毛細血管の[[透過性が亢進]]する。","輸血後 GVHD〔免疫・遅発〕：[[ドナー T 細胞]]が生着して受血者の組織を攻撃する。[[HLA 部分一致]]の血縁者間輸血でもおこる。"]}];

const CATS = [["all","すべて"],["abo","血液型"],["test","輸血検査"],["adverse","副作用・感染症"],["clinical","製剤・移植・妊娠"]];
const CATNAME = Object.fromEntries(CATS);
const KEY = "yuketsu1-drill-2fiani";
let rec = {};
try { rec = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { rec = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch(e) {} };

let cat = "all", filter = "all", order = Q.map(q => q.n), cur = 1, picked = [];

function list(){
  return order.map(n => Q[n-1]).filter(q =>
    (cat === "all" || q.c === cat) &&
    (filter === "all" || (filter === "todo" && !rec[q.n]) || (filter === "ng" && rec[q.n] && !rec[q.n].ok)));
}
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const blanks = s => esc(s).replace(/\[\[(.+?)\]\]/g, (_, t) => `<button type="button" class="blank" aria-label="空欄をタップして表示">${t}</button>`);

function renderHead(){
  const done = Object.keys(rec).length, ok = Object.values(rec).filter(r => r.ok).length;
  document.getElementById("stats").innerHTML =
    `<span><b>${done}</b>/ ${Q.length} 問 解答</span><span><b>${ok}</b>問 正解</span><span>正答率 <b>${done ? Math.round(ok/done*100) : 0}</b>%</span>`;
  document.getElementById("bar").innerHTML =
    `<i class="b-ok" style="width:${ok/Q.length*100}%"></i><i class="b-ng" style="width:${(done-ok)/Q.length*100}%"></i>`;
  const vis = new Set(list().map(q => q.n));
  document.getElementById("map").innerHTML = order.map(n => {
    const r = rec[n];
    return `<button class="cell ${r ? (r.ok ? "ok" : "ng") : ""} ${n === cur ? "cur" : ""} ${vis.has(n) ? "" : "dim"}" data-n="${n}" aria-label="問題${n}">${n}</button>`;
  }).join("");
}

function render(){
  renderHead();
  const L = list(), main = document.getElementById("main");
  if (!L.length){ main.innerHTML = `<div class="card empty">${filter === "ng" ? "間違えた問題はありません。" : filter === "todo" ? "すべて解答済みです。" : "該当する問題がありません。"}</div>`; return; }
  if (!L.some(q => q.n === cur)) cur = L[0].n;
  const q = Q[cur-1], r = rec[q.n], answered = !!r, need = q.a.length;
  const idx = L.findIndex(x => x.n === cur);
  const sel = answered ? r.sel : picked;
  let h = `<article class="card">
    <div class="qhead"><span class="qno">問題 ${q.n}</span><span class="tag">${CATNAME[q.c]}</span>${need > 1 ? '<span class="tag two">2つ選ぶ</span>' : ""}<span class="tag" style="margin-left:auto">${idx+1} / ${L.length}</span></div>
    <p class="stem">${esc(q.q)}</p>
    ${q.img ? `<figure class="fig"><img src="${IMG[q.img]}" alt="問題${q.n}の標本写真"></figure>` : ""}
    <ol class="opts">`;
  q.o.forEach((t, i) => {
    const k = i+1, isAns = q.a.includes(k), isSel = sel.includes(k);
    let cls = "", mk = "";
    if (answered){ if (isAns){ cls = "right"; mk = "正答"; } else if (isSel){ cls = "wrong"; mk = "あなたの解答"; } }
    else if (isSel) cls = "sel";
    h += `<li><button class="opt ${cls}" data-k="${k}" ${answered ? "disabled" : ""}><span class="num">${k}</span><span>${esc(t)}</span><span class="mk">${mk}</span>${answered ? `<span class="note">${esc(q.e[i])}</span>` : ""}</button></li>`;
  });
  h += `</ol>`;
  if (answered){
    const ansTxt = q.a.join("・");
    h += `<div class="verdict ${r.ok ? "ok" : "ng"}">${r.ok ? "正解" : "不正解"}<span>正答は ${ansTxt}</span></div>
      <section class="points"><h2>要点チェック <button class="btn ghost" id="openAll">空欄をすべて表示</button></h2>
      <p class="hint">色のついた空欄をタップすると答えが出ます。</p>
      <ul>${q.p.map(p => `<li>${blanks(p)}</li>`).join("")}</ul></section>`;
  }
  h += `<div class="actions">
      <button class="btn" id="prev" ${idx === 0 ? "disabled" : ""}>← 前へ</button>
      <span style="display:flex;gap:8px;flex-wrap:wrap">
      ${answered ? `<button class="btn ghost" id="retry">もう一度解く</button>` : need > 1 ? `<button class="btn primary" id="submit" ${picked.length === need ? "" : "disabled"}>解答する（${picked.length}/${need}）</button>` : ""}
      <button class="btn ${answered ? "primary" : ""}" id="next" ${idx === L.length-1 ? "disabled" : ""}>次へ →</button></span>
    </div></article>`;
  main.innerHTML = h;
}

function grade(){
  const q = Q[cur-1], s = [...picked].sort();
  rec[q.n] = { sel: s, ok: s.length === q.a.length && s.every((v,i) => v === [...q.a].sort()[i]) };
  picked = []; save(); render();
}
function choose(k){
  const q = Q[cur-1]; if (rec[q.n]) return;
  if (q.a.length === 1){ picked = [k]; grade(); return; }
  picked = picked.includes(k) ? picked.filter(x => x !== k) : picked.length < q.a.length ? [...picked, k] : [picked[1], k];
  render();
}
function go(d){ const L = list(), i = L.findIndex(x => x.n === cur), j = i + d; if (j >= 0 && j < L.length){ cur = L[j].n; picked = []; render(); window.scrollTo({top: document.getElementById("map").offsetTop - 8}); } }

document.getElementById("cats").innerHTML = CATS.map(([k,v]) => `<button class="chip" data-c="${k}" aria-pressed="${k === cat}">${v}</button>`).join("");
document.getElementById("cats").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; cat = b.dataset.c; document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b)); picked = []; render(); };
document.getElementById("filter").onchange = e => { filter = e.target.value; picked = []; render(); };
document.getElementById("shuffle").onchange = e => {
  order = Q.map(q => q.n);
  if (e.target.checked) for (let i = order.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [order[i], order[j]] = [order[j], order[i]]; }
  const L = list(); if (L.length) cur = L[0].n; picked = []; render();
};
document.getElementById("map").onclick = e => { const b = e.target.closest(".cell"); if (b){ cur = +b.dataset.n; picked = []; if (!list().some(q => q.n === cur)){ cat = "all"; filter = "all"; document.getElementById("filter").value = "all"; document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.c === "all")); } render(); } };
document.getElementById("main").onclick = e => {
  const t = e.target;
  const o = t.closest(".opt"); if (o && !o.disabled) return choose(+o.dataset.k);
  const bl = t.closest(".blank"); if (bl){ bl.classList.add("open"); return; }
  if (t.id === "openAll") document.querySelectorAll(".blank").forEach(b => b.classList.add("open"));
  if (t.id === "submit") grade();
  if (t.id === "prev") go(-1);
  if (t.id === "next") go(1);
  if (t.id === "retry"){ delete rec[cur]; save(); picked = []; render(); }
};
document.getElementById("resetArea").onclick = e => {
  const area = document.getElementById("resetArea");
  if (e.target.id === "reset") area.innerHTML = `<span class="confirm">全問の記録を消しますか？ <button class="btn" id="yes">消す</button><button class="btn ghost" id="no">やめる</button></span>`;
  if (e.target.id === "yes"){ rec = {}; save(); render(); }
  if (e.target.id === "yes" || e.target.id === "no") area.innerHTML = `<button class="btn ghost" id="reset">記録をリセット</button>`;
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  const q = Q[cur-1]; if (!q) return;
  if (/^[1-5]$/.test(e.key)) choose(+e.key);
  else if (e.key === "Enter"){ if (!rec[q.n] && q.a.length > 1 && picked.length === q.a.length){ e.preventDefault(); grade(); } else if (rec[q.n]){ e.preventDefault(); go(1); } }
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
});
render();
</script>
